[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-taxonomy-dispatcher"
version = "0.1.0"
description = "Fast deterministic skill taxonomy indexer and gated resolver for AI agent workspaces"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
taxonomy = "taxonomy.cli:main"

[tool.setuptools.package-data]
"taxonomy.web" = ["*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
